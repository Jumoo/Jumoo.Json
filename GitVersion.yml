next-version: 19.0.0
assembly-versioning-scheme: MajorMinorPatch
mode: ContinuousDeployment
branches:
  main:
    mode: ContinuousDeployment
    tag: ""
    # this repo branches per Umbraco major - v19/main, v18/main, and so on
    regex: ^v[0-9]+\/main$
  pull-request:
    mode: ContinuousDeployment
ignore:
  sha: []
merge-message-formats: {}
