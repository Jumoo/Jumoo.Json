name: Build and Package

permissions:
  contents: read

on:
  push:
    branches: [ "*/main" ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  config: Release
  out_folder: ./build-out/
  solution_name: ./Jumoo.Json.slnx
  test_project: ./Jumoo.Json.Tests/Jumoo.Json.Tests.csproj
  package_project: ./Jumoo.Json/Jumoo.Json.csproj

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_string: ${{ steps.gitversion.outputs.fullSemVer }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "5.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true
          configFilePath: ./GitVersion.yml

      # block scalar, not a plain one - the ": " inside the string would otherwise be
      # read as the start of a nested mapping.
      - name: Display version
        run: |
          echo "Full Version: ${{ steps.gitversion.outputs.fullSemVer }}"

  package-up:
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: restore
        run: dotnet restore ${{ env.solution_name }} --locked-mode

      - name: build
        run: dotnet build ${{ env.solution_name }} -c ${{ env.config }} --no-restore -p:ContinuousIntegrationBuild=true

      - name: test
        run: dotnet test ${{ env.test_project }} -c ${{ env.config }} --no-build

      # deliberately not --no-build: the version has to be stamped onto the assembly as well
      # as the nuspec, so this step rebuilds with it.
      - name: package
        run: >
          dotnet pack ${{ env.package_project }}
          -c ${{ env.config }}
          --output ${{ env.out_folder }}
          /p:version=${{ needs.version.outputs.version_string }}
          -p:ContinuousIntegrationBuild=true

      # NOTE: intentionally no `dotnet nuget push` here - this workflow builds a package
      # for review and does not release. Publishing is still a deliberate manual step.
      - name: Upload nuget package as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-build-output
          path: ${{ env.out_folder }}
