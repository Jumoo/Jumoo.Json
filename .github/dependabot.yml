version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # Umbraco is pinned deliberately. The version referenced here becomes the minimum
    # for every downstream package, so it moves when we choose to move it - not on a
    # weekly schedule. Note this also opts Umbraco out of dependabot security updates.
    ignore:
      - dependency-name: "Umbraco.*"
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # gittools/actions v4 requires GitVersion >= 6.2, which needs GitVersion.yml migrating
    # to the v6 schema. Dependabot can't see that the action version and the versionSpec
    # input are coupled, so it broke the release build once already. Unpin this when we
    # do the GitVersion 6 migration deliberately.
    ignore:
      - dependency-name: "gittools/actions"
    groups:
      github-actions:
        patterns:
          - "*"
