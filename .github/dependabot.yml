version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # Umbraco is pinned deliberately. The version referenced here becomes the minimum
    # for every downstream package, so it moves when we choose to move it - not on a
    # weekly schedule. Note this also opts Umbraco out of dependabot security updates.
    ignore:
      - dependency-name: "Umbraco.*"
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
